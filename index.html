<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<!-- ============ HEADER ============ -->

      <span class="brand-name" data-i18n="brand">أوروم</span>

    <div class="header-controls">
      <button class="icon-btn" id="lang-toggle" type="button" aria-label="تبديل اللغة">
        <span id="lang-label">EN</span>
      </button>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="تبديل الوضع الليلي">
        <svg class="ic-sun" viewBox="0 0 24 24" width="19" height="19"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.5"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4.2"/><line x1="12" y1="19.8" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4.2" y2="12"/><line x1="19.8" y1="12" x2="22.5" y2="12"/><line x1="4.5" y1="4.5" x2="6.4" y2="6.4"/><line x1="17.6" y1="17.6" x2="19.5" y2="19.5"/><line x1="4.5" y1="19.5" x2="6.4" y2="17.6"/><line x1="17.6" y1="6.4" x2="19.5" y2="4.5"/></g></svg>
        <svg class="ic-moon" viewBox="0 0 24 24" width="19" height="19"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn cart-btn" id="cart-btn" type="button" aria-label="السلة">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h2l1.6 10.2a1.6 1.6 0 0 0 1.58 1.3h8.24a1.6 1.6 0 0 0 1.58-1.34L20.5 9H7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="21" r="1.1" fill="currentColor"/><circle cx="18" cy="21" r="1.1" fill="currentColor"/></svg>
        <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
  </div>
  <div class="bezel-divider" aria-hidden="true"></div>
</header>

<!-- ============ HERO ============ -->
<section class="hero">
  <div class="hero-text">
    <p class="hero-eyebrow" data-i18n="eyebrow">صناعة سويسرية × تصميم مغربي</p>
    <h1 data-i18n="heroTitle">دقة<br>تدوم</h1>
    <p class="hero-sub" data-i18n="heroSub">مجموعة ساعات محدودة، مصنوعة من مواد فاخرة لرجل يقدّر التفاصيل.</p>
    <a href="#collection" class="btn-primary" data-i18n="heroCta">اكتشف المجموعة</a>
  </div>
  <div class="hero-art" aria-hidden="true">
    <svg viewBox="0 0 220 220" width="220" height="220">
      <circle cx="110" cy="110" r="92" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="110" cy="110" r="78" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/>
      <g stroke="currentColor" stroke-linecap="round">
        <g id="ticks"></g>
      </g>
      <line x1="110" y1="110" x2="110" y2="58" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="110" y1="110" x2="146" y2="122" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="110" cy="110" r="3.4" fill="currentColor"/>
    </svg>
  </div>
</section>

<div class="trust-row">
  <span data-i18n="trust1">الدفع عند الاستلام</span>
  <span class="dot">•</span>
  <span data-i18n="trust2">شحن مجاني</span>
  <span class="dot">•</span>
  <span data-i18n="trust3">إرجاع خلال 7 أيام</span>
</div>

<!-- ============ COLLECTION ============ -->
<section class="collection" id="collection">
  <div class="section-head">
    <h2 data-i18n="collectionTitle">المجموعة</h2>
    <div class="bezel-divider small" aria-hidden="true"></div>
  </div>

  <div class="grid" id="product-grid"><!-- تُملأ من Supabase عبر boot() --></div>
</section>

<!-- ============ FOOTER ============ -->
<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="24" height="24"><circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </span>
      <span class="brand-name" data-i18n="brand">أوروم</span>
    </div>
    <nav class="footer-links" id="footer-links"><!-- تُملأ ديناميكيًا من جدول footer_content --></nav>
    <p class="footer-copy" data-i18n="footerCopy">© 2026 أوروم. جميع الحقوق محفوظة.</p>
  </div>
</footer>

<!-- ============ MODAL (سياسات/من نحن) ============ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="إغلاق">✕</button>
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
  </div>
</div>

<!-- ============ WHATSAPP ============ -->
<a class="whatsapp-fab" href="https://wa.me/212600000000" target="_blank" rel="noopener" aria-label="واتساب">
  <svg viewBox="0 0 32 32" width="26" height="26"><path fill="currentColor" d="M16 3C9 3 3.3 8.6 3.3 15.6c0 2.4.7 4.7 1.9 6.6L3 29l7-1.9c1.8 1 3.9 1.5 6 1.5 7 0 12.7-5.6 12.7-12.6C28.7 8.6 23 3 16 3zm0 23c-1.9 0-3.7-.5-5.3-1.4l-.4-.2-4.2 1.1 1.1-4.1-.2-.4A10.4 10.4 0 0 1 5.6 15.6C5.6 9.9 10.3 5.3 16 5.3S26.4 9.9 26.4 15.6 21.7 26 16 26zm5.8-7.8c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-.9 1.2-.3.2-.6.1a8.6 8.6 0 0 1-2.5-1.5 9.3 9.3 0 0 1-1.7-2.1c-.2-.3 0-.5.1-.6l.4-.5.3-.4c.1-.2 0-.4 0-.5s-.7-1.6-.9-2.2-.4-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3 2 3 4.7 4.2c.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.9-.8 2.1-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.2-.6-.4z"/></svg>
</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/i18n.js"></script>
<script>
/* =====================================================================
   المرحلة 5 — نصوص الواجهة من data-ar.json/data-en.json، وفوتر ديناميكي
   بالكامل من جدول footer_content (لا نصوص ثابتة مكررة في الكود بعد الآن)
   ===================================================================== */
let PRODUCTS = [];
let FOOTER = [];
let SETTINGS = null;

let lang = localStorage.getItem("aurum_lang") || "ar";
let cartCount = 0;

function fmtPrice(n){ return Number(n).toLocaleString(lang === "ar" ? "ar-MA" : "en-US"); }

function renderTicks(){
  const g = document.getElementById("ticks");
  if (!g || g.children.length) return;
  for (let i = 0; i < 60; i++){
    const major = i % 5 === 0;
    const a = (i / 60) * 2 * Math.PI;
    const rOuter = 92, rInner = major ? 82 : 87;
    const x1 = 110 + rOuter * Math.sin(a), y1 = 110 - rOuter * Math.cos(a);
    const x2 = 110 + rInner * Math.sin(a), y2 = 110 - rInner * Math.cos(a);
    const line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1", x1); line.setAttribute("y1", y1);
    line.setAttribute("x2", x2); line.setAttribute("y2", y2);
    line.setAttribute("stroke-width", major ? "1.6" : "0.8");
    line.setAttribute("opacity", major ? "0.9" : "0.35");
    g.appendChild(line);
  }
}

function productImage(p){
  if (Array.isArray(p.images) && p.images.length){
    const sorted = [...p.images].sort((a, b) => (a.sort || 0) - (b.sort || 0));
    return sorted[0].url;
  }
  return null;
}

function renderProducts(){
  const grid = document.getElementById("product-grid");

  if (!PRODUCTS.length){
    grid.innerHTML = `<p class="empty-state">${lang === "ar" ? "لا توجد منتجات بعد — أضفها من لوحة التحكم." : "No products yet — add them from the dashboard."}</p>`;
    return;
  }

  grid.innerHTML = PRODUCTS.map((p) => {
    const img = productImage(p);
    const badgeClass = p.badge === "bestseller" ? "best" : p.badge;
    const sub = (p.band_types && p.band_types[0]) ? (lang === "ar" ? p.band_types[0].label_ar : p.band_types[0].label_en) : "";
    return `
    <article class="card">
      ${p.badge ? `<span class="badge ${badgeClass}">${p.badge === "new" ? DICT.badgeNew : DICT.badgeBest}</span>` : ""}
      <div class="card-media">
        ${img
          ? `<img src="${img}" alt="" loading="lazy">`
          : `<svg viewBox="0 0 40 40" width="46" height="46" class="watch-icon"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="20" y1="20" x2="20" y2="10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><line x1="20" y1="20" x2="26" y2="23" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`}
        <button class="add-btn" data-id="${p.id}" aria-label="${DICT.addToCart}">+</button>
      </div>
      <h3 class="card-name">${lang === "ar" ? p.name_ar : p.name_en}</h3>
      ${sub ? `<p class="card-sub">${sub}</p>` : `<p class="card-sub">&nbsp;</p>`}
      <div class="card-rating">★ ${p.rating || 0} <span class="reviews">(${p.reviews_count || 0})</span></div>
      <div class="card-price">
        <span class="price">${fmtPrice(p.price)} ${DICT.currency}</span>
        ${p.old_price ? `<span class="old-price">${fmtPrice(p.old_price)} ${DICT.currency}</span>` : ""}
      </div>
    </article>`;
  }).join("");

  grid.querySelectorAll(".add-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      cartCount++;
      document.getElementById("cart-count").textContent = cartCount;
      btn.classList.add("pulse");
      setTimeout(() => btn.classList.remove("pulse"), 350);
    });
  });
}

/** يبني أزرار الفوتر من جدول footer_content — إضافة/حذف زر من اللوحة ينعكس هنا مباشرة */
function renderFooter(){
  const nav = document.getElementById("footer-links");
  nav.innerHTML = FOOTER.map(f => {
    const label = lang === "ar" ? f.label_ar : f.label_en;
    return `<button class="footer-link" data-key="${f.key}">${label}</button>`;
  }).join("");

  nav.querySelectorAll(".footer-link").forEach(btn => {
    btn.addEventListener("click", () => {
      const row = FOOTER.find(f => f.key === btn.dataset.key);
      if (!row) return;
      document.getElementById("modal-title").textContent = lang === "ar" ? row.label_ar : row.label_en;
      document.getElementById("modal-body").textContent = (lang === "ar" ? row.content_ar : row.content_en) || "";
      document.getElementById("modal-overlay").classList.add("open");
    });
  });
}

async function refreshUI(){
  await loadI18n(lang);
  applyBrandOverride(SETTINGS, lang);
  applyStaticI18n(lang);
  renderProducts();
  renderFooter();
}

document.getElementById("lang-toggle").addEventListener("click", async () => {
  lang = lang === "ar" ? "en" : "ar";
  localStorage.setItem("aurum_lang", lang);
  await refreshUI();
});

const themeToggle = document.getElementById("theme-toggle");
let theme = localStorage.getItem("aurum_theme") || "light";
document.documentElement.setAttribute("data-theme", theme);
themeToggle.addEventListener("click", () => {
  theme = theme === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("aurum_theme", theme);
});

document.getElementById("modal-close").addEventListener("click", () => document.getElementById("modal-overlay").classList.remove("open"));
document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target.id === "modal-overlay") e.target.classList.remove("open");
});

async function boot(){
  SETTINGS = await fetchSiteSettings();
  if (SETTINGS){
    if (!localStorage.getItem("aurum_theme") && SETTINGS.default_theme){
      theme = SETTINGS.default_theme;
      document.documentElement.setAttribute("data-theme", theme);
    }
    if (SETTINGS.logo_url){
      document.querySelectorAll(".brand-mark").forEach(el => {
        el.innerHTML = `<img src="${SETTINGS.logo_url}" alt="" style="width:28px;height:28px;object-fit:contain">`;
      });
    }
  }

  PRODUCTS = await fetchActiveProducts();
  FOOTER = await fetchFooterContent();

  renderTicks();
  await refreshUI();
  logVisit("home");
}

boot();
</script>
</body>
</html>
